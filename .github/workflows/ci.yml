name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-unit:
    name: Build and unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: JVM build and unit tests (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd --batch-mode --no-transfer-progress verify
      - name: JVM build and unit tests (Linux)
        if: runner.os == 'Linux'
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Frontend install, build and component tests
        working-directory: frontend
        run: |
          npm ci --no-fund
          npm run build
          npm test
      - name: Configuration and negative HTTP checks
        run: node --test tools/runtime.test.mjs tools/frontend-config.test.mjs tools/storage-startup.test.mjs
      - name: Documentation links
        run: node tools/check-doc-links.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: tools/requirements-contracts.txt
      - name: Install pinned contract validation tools
        run: python -m pip install --disable-pip-version-check -r tools/requirements-contracts.txt
      - name: Solver contract schemas, fixtures and semantic checks (no solver)
        run: python tools/check_solver_contract.py

  process-http:
    name: Linux processes and real frontend/backend HTTP
    needs: build-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: terma_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: terma_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U terma_ci -d terma_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/terma_ci
      SPRING_DATASOURCE_USERNAME: terma_ci
      SPRING_DATASOURCE_PASSWORD: ephemeral-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Package the independent processes
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Process bootstrap, liveness and negative startup checks
        run: node tools/process-smoke.mjs
      - name: Build frontend and install Chromium
        working-directory: frontend
        run: |
          npm ci --no-fund
          npm run build
          npx --no-install playwright install --with-deps chromium
      - name: Generate ephemeral browser-test passwords
        run: |
          node --input-type=module -e "import {randomUUID} from 'node:crypto'; import {appendFileSync} from 'node:fs'; for (const n of [1,2]) { const value=randomUUID(); console.log('::add-mask::'+value); appendFileSync(process.env.GITHUB_ENV, 'TERMA_E2E_PASSWORD_'+n+'='+value+'\n'); }"
      - name: Real browser HTTP (no positive-response mock)
        working-directory: frontend
        run: npm run test:e2e
      - name: E2E isolation from developer environment and local env file
        working-directory: frontend
        env:
          TERMA_FRONTEND_PORT: '5199'
          TERMA_BACKEND_URL: http://127.0.0.1:8081
          SERVER_PORT: '8081'
          SERVER_ADDRESS: '::1'
        run: |
          # This is an isolated CI checkout; never overwrite a developer's local file.
          test ! -e .env.local
          trap 'rm -f .env.local' EXIT
          printf 'TERMA_FRONTEND_PORT=5198\nTERMA_BACKEND_URL=http://127.0.0.1:8082\n' > .env.local
          npm run test:e2e
      - name: Infrastructure verification scope
        run: echo "PostgreSQL startup migrations checked; Kafka and scientific computation NOT_IMPLEMENTED."

  postgresql:
    name: PostgreSQL migrations and startup failures
    needs: build-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: terma_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: terma_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U terma_ci -d terma_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/terma_ci
      SPRING_DATASOURCE_USERNAME: terma_ci
      SPRING_DATASOURCE_PASSWORD: ephemeral-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - name: Verify both real JARs against PostgreSQL (no H2 or skips)
        run: ./mvnw --batch-mode --no-transfer-progress -Ppostgresql-it verify
