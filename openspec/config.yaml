schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Thermodynamic modelling project; application-scaffold implementation is now authorized.
  Read AGENTS.md and docs/project-foundation.md for REQ-*, SCN-* and PROP-*.
  Use docs/domain-glossary.md, docs/architecture.md, docs/adr/README.md,
  docs/open-questions.md and docs/development-workflow.md; link rather than duplicate.
  Preserve traceability to source IDs and ADR; proposals are not accepted decisions.
  The user approved application-scaffold design and its required technology subset.
  Implement its tasks, install required dependencies and run local/CI checks.
  The prototype now requires actual simplified minimization and distinct input/output (ADR-0010,
  REQ-SCI-008 through REQ-SCI-012); echoing inputs without calculation was superseded.
  The method, model, data and numerical acceptance examples remain open (Q-SCI-004 through Q-SCI-006).
  This decision updates documentation only; a solver change needs its own reviewed SDD artifacts.
  Keep application-scaffold free of domain features, a solver/scientific contracts, jobs, database/broker integration,
  outbox, series, transfer or CSV. Never deploy infrastructure, access the VPS or request secrets.
  Temurin 25.0.4.1+1 was explicitly approved instead of 25.0.5+8 (no Windows asset).
  Do not archive before implementation review; check moved and incoming links at future archive.
  Work on a separate Git branch and submit a PR, never directly to main.
  Windows 10 development must not require WSL2, Docker or access to the user's VPS.
  HCh/Unitherm interfaces and compatibility are unknown; do not invent them.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

rules:
  proposal:
    - Separate observed state, proposed scope and exclusions.
  specs:
    - Use stable requirement and scenario IDs, and links to source requirements and ADR.
    - Distinguish build, process startup, HTTP interaction, infrastructure availability and integration checks.
  design:
    - Link docs/technology-baseline.md for exact versions and official evidence instead of duplicating the table.
    - Separate Windows checks without Docker, Linux CI and future PostgreSQL/Kafka integration checks.
  tasks:
    - Mark tasks complete only after implementation and their specified checks; record unavailable checks honestly.

operations:
  apply:
    guidance:
      - Implementation is explicitly authorized for application-scaffold; preserve scope and acceptance criteria.
  archive:
    guidance:
      - Never archive or sync an unimplemented proposal into main specs as delivered behavior.
