schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Thermodynamic modelling project. Application-scaffold is implemented, built and verified;
  PR 2 is merged and scaffold versions are pinned. Do not restart its implementation.
  Read AGENTS.md and docs/project-foundation.md for REQ-*, SCN-* and PROP-*.
  Use docs/domain-glossary.md, docs/architecture.md, docs/adr/README.md,
  docs/open-questions.md and docs/development-workflow.md; link rather than duplicate.
  Preserve traceability to source IDs and ADR; proposals are not accepted decisions.
  Current scope is equilibrium-engine-contract: documentation, evidence, ADR, JSON Schemas,
  synthetic examples and validation only (REQ-STAGE-005, ADR-0011, docs/solver-contract.md).
  PR 4 review explicitly authorizes committed validation tools and pinned dependencies,
  Windows/Linux CI checks, scoped requirements including SPECIES and explicit version negotiation.
  The prototype requires actual simplified computation; echoing input is cancelled (ADR-0010).
  Fix the application contract separately from HCh's unknown internal API and runtime.
  No solver/adapter implementation, optimizer installation, computation module, Java DTO,
  PostgreSQL/Kafka integration, UI changes, transfer/mixing implementation or infrastructure.
  LP, constant H/S/V and Hipparchus remain a candidate; do not choose a version or dependency.
  Architectural and scientific decisions are discussed with the user in web;
  local Codex documents agreed decisions and implements specifically assigned tasks.
  Surface gaps changing domain semantics with options; never invent a scientific model.
  Routine technical implementation choices remain within the local agent's competence.
  Preserve model/library versions, immutable run snapshots/results, rights, reproducibility and future CSV.
  Contract preservation after HCh is a goal, not proven compatibility; version changes explicitly.
  Never deploy infrastructure, access the VPS or request secrets.
  Temurin 25.0.4.1+1 was explicitly approved instead of 25.0.5+8 (no Windows asset).
  Do not archive or sync application-scaffold in this task; that is a separate action.
  Work on a separate Git branch and submit a PR, never directly to main.
  Windows 10 development must not require WSL2, Docker or access to the user's VPS.
  HCh/Unitherm interfaces and compatibility are unknown; do not invent them.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

rules:
  proposal:
    - Separate observed state, proposed scope and exclusions.
  specs:
    - Use stable requirement and scenario IDs, and links to source requirements and ADR.
    - Distinguish build, process startup, HTTP interaction, infrastructure availability and integration checks.
  design:
    - Link docs/technology-baseline.md for exact versions and official evidence instead of duplicating the table.
    - Separate Windows checks without Docker, Linux CI and future PostgreSQL/Kafka integration checks.
  tasks:
    - Mark tasks complete only after implementation and their specified checks; record unavailable checks honestly.

operations:
  apply:
    guidance:
      - Current authorization covers contract documents, schemas, examples and validation only; no solver or DTO implementation.
  archive:
    guidance:
      - Never archive or sync an unimplemented proposal into main specs as delivered behavior.
